name: V10 Bearish Midpoint Retrace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v10.yml"
      - "v10/run.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-midpoint-retrace
  cancel-in-progress: false

jobs:
  research-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl
      - name: Self test
        run: python v10/run.py --self-test
      - name: Run midpoint research
        run: |
          python v10/run.py \
            --interval 5m \
            --period 60d \
            --batch-size 20 \
            --symbol-chunk 100 \
            --shares 100 \
            --slippage 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monex-v10-midpoint-results
          path: |
            outputs/summary_v10.json
            outputs/RESULT_V10_JP.md
            outputs/summary_by_window.csv
            outputs/midpoint_trades.csv
            outputs/download_report.csv
          if-no-files-found: warn
          retention-days: 7
      - name: Safety check
        if: always()
        run: |
          echo "LIVE TRADING: DISABLED"
          echo "REAL ORDERS: NOT SENT"
